name: Build kernels

env:
  OUT_DIR: "out"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
      kernelPrivateSource:
        description: "Is private source?"
        required: false
        type: boolean
        default: false
      kernelBranch:
        description: "Kernel branch"
        required: true
        type: string
      kernelDevice:
        description: "Device (defconfig prefix)"
        required: true
        type: string
        default: "gki"
      kernelSourceName:
        description: "Kernel source folder name"
        required: true
        type: string
      localVersion:
        description: "Custom localversion"
        required: false
        type: string
        default: ""
      kernelSUChoice:
        description: "KernelSU Variant"
        required: true
        type: choice
        options:
          - "None"
          - "KernelSU"
          - "KernelSU-Next"
          - "KernelSU-Next + Next-SuSFS"
          - "KernelSU by @rsuntk"
          - "SukiSU"
          - "ReSukiSU"
          - "WKSU"
        default: "KernelSU"
      USE_SUSFS:
        type: boolean
        default: true
      USE_KPM:
        type: boolean
        default: false
      USE_SUKISU:
        type: boolean
        default: false
      APPLY_NOMOUNT:
        type: boolean
        default: true
      APPLY_ZRAM:
        type: boolean
        default: true
      APPLY_BBR:
        type: boolean
        default: true
      APPLY_VFS:
        type: boolean
        default: true
      APPLY_LTO_THIN:
        type: boolean
        default: true
      clangCompiler:
        description: "Clang compiler"
        required: true
        type: choice
        options:
          - "ZyC Clang"
          - "Greenforce Clang"
          - "SuperRyzen Clang"
          - "WeebX Clang"
        default: "ZyC Clang"

jobs:
  build:
    name: "Build Kernel"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Timestamp
      run: echo "BUILD_TIME=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc curl flex cpio ccache rsync git zip dwarves libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lftp zstd wget libfl-dev python3 libarchive-tools \
          clang lld llvm llvm-dev jq

    # ============================================================
    # CLANG CACHE RESTORE
    # ============================================================
    - name: Restore Clang Cache
      id: clang-cache
      uses: actions/cache@v4
      with:
        path: clang
        key: clang-${{ github.event.inputs.clangCompiler }}-${{ runner.os }}

    # ============================================================
    # DOWNLOAD CLANG (WITH FALLBACK + UNIVERSAL DETECTION)
    # ============================================================
    - name: Download Clang Toolchain
      if: steps.clang-cache.outputs.cache-hit != 'true'
      run: |
        get_latest() {
          curl -sL "https://api.github.com/repos/$1/releases/latest" \
            | grep "browser_download_url.*tar.gz" \
            | cut -d '"' -f 4 \
            | head -n 1
        }

        pick_clang() {
          case "$1" in
            "ZyC Clang") get_latest "ZyCromerZ/Clang" ;;
            "Greenforce Clang") get_latest "greenforce-project/greenforce_clang" ;;
            "WeebX Clang") get_latest "XSans0/WeebX-Clang" ;;
            "SuperRyzen Clang") echo "https://gitlab.com/TianWalkzzMiku/SuperRyzen-Clang/" ;;
          esac
        }

        URL=$(pick_clang "${{ github.event.inputs.clangCompiler }}")

        echo "Downloading Clang from: $URL"
        mkdir -p clang

        if [[ "$URL" == *.tar.gz ]]; then
          wget -O clang/clang.tar.gz "$URL" || FALLBACK=1
        else
          git clone --depth=1 "$URL" clang || FALLBACK=1
        fi

        if [[ "$FALLBACK" == "1" ]]; then
          echo "Primary Clang failed — using fallback"
          URL=$(pick_clang "Greenforce Clang")
          wget -O clang/clang.tar.gz "$URL"
        fi

        if [[ -f clang/clang.tar.gz ]]; then
          tar -xf clang/clang.tar.gz -C clang
        fi

    # ============================================================
    # UNIVERSAL CLANG DETECTION
    # ============================================================
    - name: Detect Clang
      run: |
        echo "Searching for clang binary..."
        CLANG_PATH=$(find clang -type f -name "clang*" | grep "/bin/" | head -n 1 | xargs dirname 2>/dev/null)

        if [ -z "$CLANG_PATH" ]; then
          echo "❌ Could not locate clang binary"
          ls -R clang
          exit 1
        fi

        echo "Found Clang in: $CLANG_PATH"
        echo "$CLANG_PATH" >> $GITHUB_PATH
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV

    # ============================================================
    # CCACHE CACHE RESTORE
    # ============================================================
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.sha }}
        restore-keys: |
          ccache-

    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV

    # ============================================================
    # CLONE KERNEL SOURCE
    # ============================================================
    - name: Clone Kernel Source
      run: |
        mkdir -p kernel
        git clone --depth=1 --branch "${{ github.event.inputs.kernelBranch }}" \
          "${{ github.event.inputs.kernelSourceURL }}" kernel

    # ============================================================
    # APPLY PATCH MANAGER (CORRECT PATH)
    # ============================================================
    - name: Apply Patch Manager
      working-directory: ./kernel
      run: |
        chmod +x $GITHUB_WORKSPACE/.github/scripts/patch-scripts.sh
        bash $GITHUB_WORKSPACE/.github/scripts/patch-scripts.sh
      env:
        USE_SUSFS: ${{ github.event.inputs.USE_SUSFS }}
        USE_KPM: ${{ github.event.inputs.USE_KPM }}
        USE_SUKISU: ${{ github.event.inputs.USE_SUKISU }}
        APPLY_NOMOUNT: ${{ github.event.inputs.APPLY_NOMOUNT }}
        APPLY_ZRAM: ${{ github.event.inputs.APPLY_ZRAM }}
        APPLY_BBR: ${{ github.event.inputs.APPLY_BBR }}
        APPLY_VFS: ${{ github.event.inputs.APPLY_VFS }}
        APPLY_LTO_THIN: ${{ github.event.inputs.APPLY_LTO_THIN }}

    # ============================================================
    # APPLY KERNELSU VARIANT
    # ============================================================
    - name: Apply KernelSU Variant
      working-directory: ./kernel
      run: |
        case "${{ github.event.inputs.kernelSUChoice }}" in
          "None") echo "Skipping KernelSU" ;;
          "KernelSU") curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main ;;
          "KernelSU-Next") curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/stable/kernel/setup.sh | bash -s stable ;;
          "KernelSU-Next + Next-SuSFS") curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next-susfs/kernel/setup.sh | bash -s next-susfs ;;
          "KernelSU by @rsuntk") curl -LSs https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh | bash -s main ;;
          "SukiSU") curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin ;;
          "ReSukiSU") curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh | bash -s susfs-ksud ;;
          "WKSU") curl -LSs https://raw.githubusercontent.com/WildKernels/Wild_KSU/stable/kernel/setup.sh | bash -s canary ;;
        esac

    # ============================================================
    # LOCALVERSION
    # ============================================================
    - name: Set Localversion
      working-directory: ./kernel
      run: |
        if [ -n "${{ github.event.inputs.localVersion }}" ]; then
          echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.localVersion }}\"" >> arch/arm64/configs/${{ github.event.inputs.kernelDevice }}_defconfig
        fi

    # ============================================================
    # BUILD
    # ============================================================
    - name: Build Defconfig
      working-directory: ./kernel
      run: make O=out ARCH=arm64 LLVM=1 ${{ github.event.inputs.kernelDevice }}_defconfig

    - name: Build Kernel
      working-directory: ./kernel
      run: |
        export KBUILD_BUILD_USER="Jeremy"
        export KBUILD_BUILD_HOST="Jweber0689"
        make -j$(nproc --all) O=out ARCH=arm64 LLVM=1

    # ============================================================
    # PACKAGE ANYKERNEL3
    # ============================================================
    - name: Package AnyKernel3
      working-directory: ./kernel
      run: |
        git clone https://github.com/topnotchfreaks/AnyKernel3.git --depth=1
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 "../kernel_${{ github.event.inputs.kernelDevice }}_${{ env.BUILD_TIME }}.zip" ./*

    # ============================================================
    # UPLOAD ARTIFACT
    # ============================================================
    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel_${{ github.event.inputs.kernelDevice }}_${{ env.BUILD_TIME }}
        path: ./kernel/kernel_${{ github.event.inputs.kernelDevice }}_${{ env.BUILD_TIME }}.zip
